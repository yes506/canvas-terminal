[package]
name = "canvas-terminal"
version = "0.5.1"
edition = "2021"

[lib]
name = "canvas_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.8"
libc = "0.2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
dirs = "6"
serde_json = "1"
mime_guess = "2"

# Dashboard server (v4+v5 plan).
# tokio: net for TcpListener, sync for broadcast, time for interval timer.
# rt-multi-thread/macros so the spawned async tasks compile against the same
# tokio runtime tauri::async_runtime exposes.
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros", "fs"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
rust-embed = { version = "8", features = ["debug-embed"] }
futures = "0.3"
rand = "0.8"
hex = "0.4"
# Filesystem watcher for the transcripts subsystem (peer-context-mirror).
# Adds FSEvents on macOS, inotify on Linux. Cross-platform abstraction;
# `RecommendedWatcher` is held by `commands::transcripts::TranscriptWatcher`.
notify = "6"

# macOS-only deps for the native window-capture command
# (commands::capture). core-graphics gives us CGWindowListCreateImage +
# ScreenCaptureAccess preflight/request; objc2-app-kit lets us go from
# Tauri's NSWindow* to a CGWindowID via -[NSWindow windowNumber]; the
# image crate handles RGBA → PNG encoding after the BGRA byte-swap that
# CGWindowListCreateImage's pixel format demands.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# `tower::ServiceExt::oneshot` is the cleanest way to drive an axum Router
# in unit tests without binding a real TCP port. Test-only — the production
# server uses axum::serve directly.
tower = { version = "0.5", features = ["util"] }
