[package]
name = "canvas-terminal"
version = "0.3.9"
edition = "2021"

[lib]
name = "canvas_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.8"
libc = "0.2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
dirs = "6"
serde_json = "1"

# Dashboard server (v4+v5 plan).
# tokio: net for TcpListener, sync for broadcast, time for interval timer.
# rt-multi-thread/macros so the spawned async tasks compile against the same
# tokio runtime tauri::async_runtime exposes.
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
rust-embed = { version = "8", features = ["debug-embed"] }
futures = "0.3"
rand = "0.8"
hex = "0.4"

# P2 backend: file-lock for git_merge_worktree's concurrent-merge mutex.
# v5 §3 D8 explicitly requires Rust-side locking, not shell `flock` — macOS
# doesn't ship `flock(1)` natively, and the lock must survive process
# crashes (held → owning PID dead → take ownership).
fs2 = "0.4"

[dev-dependencies]
# `tower::ServiceExt::oneshot` is the cleanest way to drive an axum Router
# in unit tests without binding a real TCP port. Test-only — the production
# server uses axum::serve directly.
tower = { version = "0.5", features = ["util"] }
# PR-A: process-wide TempDir-backed test root override. Every Rust test that
# allocates managed worktree paths uses this instead of the production
# `~/.cache/canvas-terminal/worktrees/` root, so `cargo test` produces zero
# entries under the production root. See git.rs `worktrees_root_for_test`.
tempfile = "3"
# PR-A: `dirs::home_dir()` used by tests/policy_jail_smoke.rs to reconstruct
# the expected production root path independently of the lib's path logic.
# Integration tests don't transitively get the lib's [dependencies] as
# direct imports, so this needs to be declared here too.
dirs = "6"
