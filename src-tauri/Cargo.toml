[package]
name = "canvas-terminal"
version = "0.4.0-worktree.1"
edition = "2021"

[lib]
name = "canvas_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.8"
libc = "0.2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
dirs = "6"
serde_json = "1"

# Dashboard server (v4+v5 plan).
# tokio: net for TcpListener, sync for broadcast, time for interval timer.
# rt-multi-thread/macros so the spawned async tasks compile against the same
# tokio runtime tauri::async_runtime exposes.
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
rust-embed = { version = "8", features = ["debug-embed"] }
futures = "0.3"
rand = "0.8"
hex = "0.4"

# Worktree subsystem (Phase 2 foundation per final-implementation-plan §3a).
# fs2: cross-platform flock for orchestrator + per-worktree lockfiles.
# nix: process-group signals (killpg) and setsid for agent provisioning.
fs2 = "0.4"
nix = { version = "0.27", features = ["signal", "process"] }
# Phase 5 D17: secret detector per spec §4.3 — explicit regex shapes
# (AKIA[0-9A-Z]{16}, GitHub PAT 36-char tail, AWS secret 40-char b64,
# Slack tokens, PEM private-key headers).
regex = "1"
# Phase 5 E24: structured logging. Replaces ad-hoc eprintln! in
# heartbeat/monitor/drainer/reaper. Subscriber configured via
# RUST_LOG env var; defaults to compile-time targets only when
# unset.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `tower::ServiceExt::oneshot` is the cleanest way to drive an axum Router
# in unit tests without binding a real TCP port. Test-only — the production
# server uses axum::serve directly.
tower = { version = "0.5", features = ["util"] }

# Worktree subsystem test deps.
tempfile = "3"
proptest = "1"
# H9 — serialize tests that touch process-wide singletons
# (audit_log VecDeque, supervisor_registry HashMap, env vars).
# Without this, parallel test runs racily intermix entries from
# different tests, causing flaky assertions on log/registry order
# and content. Per claude2 I1.
serial_test = "3"
# Phase 4 T2.1 fix per claude2 Q1 + claude3 Issue 1: tokio test-util
# enables `#[tokio::test(start_paused = true)]` so heartbeat tick
# behavior can be tested with virtual time instead of real sleeps.
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
