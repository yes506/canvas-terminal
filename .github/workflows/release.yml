name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            arch_label: apple-silicon
          - name: intel
            runner: macos-latest
            target: x86_64-apple-darwin
            arch_label: intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Strip extended attributes from checkout
        run: xattr -cr .

      - name: Import Apple certificate into temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          INTERMEDIATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"

          # Decode .p12 from base64 secret
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          # Create + unlock a fresh temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the signing cert + private key
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Add temp keychain to user's search list (preserve existing entries)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          # Make the temp keychain the default — required for codesign called by
          # third-party tools (e.g. Tauri bundler) which doesn't pass --keychain
          # explicitly and only checks the default keychain on some macOS versions.
          security default-keychain -s "$KEYCHAIN_PATH"

          # Grant codesign / Apple tools silent access to the private key
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Install Apple's Developer ID G2 intermediate CA — required for chain
          # validation; macOS runners don't always have the G2 variant pre-installed.
          # Many .p12 exports from Keychain Access include the chain, so the
          # intermediate may already be present — treat "already exists" as success.
          curl -sSL -o "$INTERMEDIATE_PATH" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          IMPORT_LOG="$RUNNER_TEMP/intermediate-import.log"
          if security import "$INTERMEDIATE_PATH" -k "$KEYCHAIN_PATH" >"$IMPORT_LOG" 2>&1; then
            cat "$IMPORT_LOG"
          elif grep -q "already exists" "$IMPORT_LOG"; then
            echo "G2 intermediate already in keychain (bundled with .p12 chain) — ok"
          else
            cat "$IMPORT_LOG" >&2
            exit 1
          fi
          rm -f "$IMPORT_LOG"

          # Confirm a codesigning-eligible identity is reachable via the SAME code
          # path codesign uses (search list + default keychain) — no explicit
          # keychain arg. If this fails, fail at <1s rather than 3+ min into build.
          security find-identity -v -p codesigning

          # Resolve the imported cert to the exact SHA-1 token that `codesign -s`
          # accepts. This is more reliable than passing the CN string from secrets,
          # which can fail on whitespace/formatting differences.
          RESOLVED_IDENTITY_SHA=$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -v name="$APPLE_SIGNING_IDENTITY_NAME" '
                index($0, name) { print $2; found=1; exit }
                END { if (!found) exit 1 }
              '
          ) || RESOLVED_IDENTITY_SHA=""

          if [ -z "$RESOLVED_IDENTITY_SHA" ]; then
            RESOLVED_IDENTITY_SHA=$(
              security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk '/Developer ID Application:/ { print $2; exit }'
            )
          fi

          if [ -z "$RESOLVED_IDENTITY_SHA" ]; then
            echo "ERROR: Could not resolve a Developer ID Application identity from imported keychain"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY_SHA=$RESOLVED_IDENTITY_SHA" >> "$GITHUB_ENV"

          # Wipe the .p12 + intermediate file from disk (still in keychain)
          rm -f "$CERT_PATH" "$INTERMEDIATE_PATH"

      - name: Stage App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Decoupled build & notarization (replaces the previous single-step
      # `Build, sign, and notarize Tauri app` and its retry-the-whole-build
      # loop). Two bugs were stacked in the old flow:
      #   A) Tauri v2 only notarizes the .app, never the DMG container, so
      #      the published DMG was signed-but-unnotarized → users hit
      #      "source=Unnotarized Developer ID" at install time.
      #   B) Tauri's auto-notarization runs *inside* `tauri build`. When
      #      Apple's long-poll dropped on macos-latest's NSURLSession,
      #      the build returned nonzero and the outer retry loop spawned
      #      a fresh `tauri build` (and therefore a fresh Apple submission)
      #      instead of re-polling the in-flight one. Result: ~6h job
      #      timeouts on v0.3.5 and v0.3.6.
      # Fix: build with signing only (Tauri sees no APPLE_API_*, skips
      # notarization), then submit/staple .app and DMG explicitly with
      # poll-level retry via scripts/notarize-and-staple.sh.

      - name: Build & sign Tauri app (no auto-notarization)
        env:
          APPLE_SIGNING_IDENTITY_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          APPLE_SIGNING_IDENTITY=$(printf '%s' "${APPLE_SIGNING_IDENTITY_SHA:-}" | sed 's/[[:space:]]*$//')
          export APPLE_SIGNING_IDENTITY
          echo "Using signing identity SHA: ${APPLE_SIGNING_IDENTITY:0:12}..."
          echo "Requested signing identity name: $(printf '%s' "$APPLE_SIGNING_IDENTITY_NAME" | sed 's/[[:space:]]*$//')"

          # Defense in depth: explicitly unset every credential combo Tauri's
          # bundler recognizes (see tauri-bundler src/bundle/macos/sign.rs's
          # notarize_auth fn). This keeps the skip path robust against future
          # refactors that might add APPLE_API_* to $GITHUB_ENV — without
          # this, Tauri's auto-notarization could silently re-engage and
          # bring the 6h CI-hang failure mode back.
          # NOTE: if you add another `tauri build` step later (e.g. for a
          # different bundle target), mirror this unset block there too.
          unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH \
                APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"

          # No APPLE_API_* in env → Tauri signs but skips notarization.
          # No outer retry loop — the build itself does not call Apple's
          # network and so does not exhibit the poll-drop hang.
          npx tauri build --target ${{ matrix.target }}

      - name: Notarize and staple .app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app bundle not found under $BUNDLE_DIR/macos"
            exit 1
          fi
          echo "Notarizing: $APP"

          # notarytool needs a flat container — submit a zip, staple the .app.
          ZIP="$RUNNER_TEMP/canvas-terminal-app.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"

          bash scripts/notarize-and-staple.sh "$ZIP" "$APP"

      - name: Re-bundle DMG with stapled .app
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -type d | head -1)
          DMG=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -type f | head -1)
          if [ -z "$APP" ] || [ -z "$DMG" ]; then
            echo "ERROR: APP or DMG not found (APP=$APP DMG=$DMG)"
            exit 1
          fi

          # Tauri's DMG already has its custom layout (window size, icon
          # positions, /Applications symlink). We swap the inner .app for
          # the now-stapled one in-place, preserving the layout, instead of
          # rebuilding the DMG from scratch.
          DMG_RW="$RUNNER_TEMP/work.dmg"
          MNT="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$MNT"

          # Belt-and-suspenders: ensure the volume gets detached even if a
          # later command in this step fails. GitHub-hosted runners are
          # single-use so a leaked mount wouldn't poison subsequent runs,
          # but a clean detach makes failure logs easier to read and is
          # required for self-hosted runners.
          trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT

          hdiutil convert "$DMG" -format UDRW -ov -o "$DMG_RW"
          hdiutil attach "$DMG_RW" -readwrite -nobrowse -mountpoint "$MNT"

          INNER_APP=$(find "$MNT" -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$INNER_APP" ]; then
            echo "ERROR: no .app found inside DMG after mount"
            exit 1
          fi
          INNER_PARENT=$(dirname "$INNER_APP")
          rm -rf "$INNER_APP"
          # `ditto` is the macOS-canonical bundle copy: explicitly preserves
          # ACLs, resource forks, and extended attributes (the staple ticket
          # is stored as both a ticket file and xattrs). `cp -R` works in
          # practice on modern macOS but `ditto` is what Apple's own tools
          # use for app-bundle copies.
          ditto "$APP" "$INNER_PARENT/$(basename "$APP")"
          # Some macOS versions cache attribute state; sync before detach.
          sync || true
          hdiutil detach "$MNT"
          trap - EXIT

          # Recompress to UDZO (the format Tauri originally produced) and
          # replace the original artifact.
          DMG_FINAL="$RUNNER_TEMP/final.dmg"
          hdiutil convert "$DMG_RW" -format UDZO -imagekey zlib-level=9 -ov -o "$DMG_FINAL"
          mv -f "$DMG_FINAL" "$DMG"
          rm -f "$DMG_RW"
          echo "Re-bundled DMG: $DMG"

      - name: Sign re-bundled DMG
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          DMG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f | head -1)
          [ -z "$DMG" ] && { echo "ERROR: DMG not found"; exit 1; }

          APPLE_SIGNING_IDENTITY=$(printf '%s' "${APPLE_SIGNING_IDENTITY_SHA:-}" | sed 's/[[:space:]]*$//')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"

          # --force to overwrite Tauri's original DMG signature (the bytes
          # changed when we swapped the .app, so the old signature is invalid).
          # --keychain explicit: defense against future refactors of the
          # default-keychain plumbing in the import step. Hardened runtime is
          # not applicable to a DMG container (it gates executable code, not
          # disk images) so we don't pass --options runtime here.
          codesign --sign "$APPLE_SIGNING_IDENTITY" \
            --keychain "$RUNNER_TEMP/build.keychain-db" \
            --timestamp \
            --force \
            "$DMG"
          codesign --verify --verbose=2 "$DMG"

      - name: Notarize and staple DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          DMG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f | head -1)
          [ -z "$DMG" ] && { echo "ERROR: DMG not found"; exit 1; }
          bash scripts/notarize-and-staple.sh "$DMG"

      - name: Capture notarization debug info on failure
        if: failure()
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set +e
          mkdir -p notary-debug

          if [ -z "${APPLE_API_KEY_PATH:-}" ] || [ ! -f "$APPLE_API_KEY_PATH" ]; then
            echo "API key file unavailable — failure happened before key was staged"
            exit 0
          fi

          echo "Fetching recent notarization history..."
          xcrun notarytool history \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json \
            > notary-debug/history.json 2> notary-debug/history.stderr.txt

          LATEST_ID=$(jq -r '.history[0].id // empty' notary-debug/history.json 2>/dev/null)

          if [ -n "$LATEST_ID" ]; then
            echo "Most recent submission: $LATEST_ID"
            echo "$LATEST_ID" > notary-debug/latest-submission-id.txt
            xcrun notarytool log "$LATEST_ID" notary-debug/log.json \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              2> notary-debug/log.stderr.txt
            xcrun notarytool info "$LATEST_ID" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              > notary-debug/info.txt 2>&1
          else
            echo "No submission found in history — failure may have happened before submit" \
              > notary-debug/no-submission.txt
          fi
          exit 0

      - name: Upload notarization debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notary-debug-${{ matrix.arch_label }}
          path: notary-debug/
          if-no-files-found: ignore

      - name: Verify signature & notarization
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -type d | head -1)
          DMG=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -type f | head -1)

          if [ -z "$APP" ] || [ -z "$DMG" ]; then
            echo "ERROR: bundle not found (APP=$APP DMG=$DMG)"
            exit 1
          fi

          echo "::group::codesign --verify (.app)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "::endgroup::"

          echo "::group::codesign authority chain (.app)"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags|Signature|Timestamp|Runtime"
          echo "::endgroup::"

          echo "::group::stapler validate (.app)"
          xcrun stapler validate "$APP"
          echo "::endgroup::"

          echo "::group::stapler validate (.dmg)"
          xcrun stapler validate "$DMG"
          echo "::endgroup::"

          # The unambiguous green-light token is `source=Notarized Developer ID`
          # in spctl output. Plain `source=Developer ID` (no "Notarized") means
          # signed but not notarized → end users get blocked at install/launch.
          # `|| true` keeps the captured output flowing through to echo + grep
          # even when spctl exits nonzero (rejected case) — without it,
          # `set -e` aborts at the assignment and the diagnostic gets eaten.
          echo "::group::Gatekeeper assessment (.app — execute)"
          APP_ASSESS=$(spctl --assess --type execute --verbose=4 "$APP" 2>&1 || true)
          echo "$APP_ASSESS"
          echo "$APP_ASSESS" | grep -q "source=Notarized Developer ID" \
            || { echo "ERROR: .app is not notarized — got: $APP_ASSESS"; exit 1; }
          echo "::endgroup::"

          echo "::group::Gatekeeper assessment (.dmg — install)"
          DMG_ASSESS=$(spctl --assess --type install --verbose=4 "$DMG" 2>&1 || true)
          echo "$DMG_ASSESS"
          echo "$DMG_ASSESS" | grep -q "source=Notarized Developer ID" \
            || { echo "ERROR: .dmg is not notarized — got: $DMG_ASSESS"; exit 1; }
          echo "::endgroup::"

      - name: Rename DMG with architecture label
        run: |
          DMG_FILE=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "ERROR: No DMG file found"
            exit 1
          fi
          BASENAME=$(basename "$DMG_FILE" .dmg)
          VERSION="${BASENAME##*_}"
          NEW_NAME="Canvas-Terminal_${VERSION}_${{ matrix.arch_label }}.dmg"
          cp "$DMG_FILE" "$NEW_NAME"
          echo "DMG_PATH=$NEW_NAME" >> $GITHUB_ENV
          echo "Built: $NEW_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch_label }}
          path: ${{ env.DMG_PATH }}

      - name: Clean up keychain & API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" 2>/dev/null || true

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
